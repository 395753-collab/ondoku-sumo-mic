<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>音読大相撲 - マイク判定</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #8b0000;
      --green: #1a7a45;
      --blue: #1a5276;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif JP', serif;
      background: #fdfaf0;
      min-height: 100vh;
      padding: 20px 16px 60px;
      color: #1c1c1c;
    }
    .card {
      background: white;
      border: 2px solid var(--red);
      border-radius: 14px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
    }
    h1 {
      text-align: center;
      font-size: 1.3rem;
      color: var(--red);
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      font-size: .8rem;
      color: #888;
      margin-bottom: 16px;
    }
    #textDisplay {
      background: #fdfaf0;
      border: 1px solid #d8d0b8;
      border-radius: 10px;
      padding: 14px;
      font-size: 1.1rem;
      line-height: 2;
      margin-bottom: 14px;
      min-height: 60px;
    }
    #status {
      text-align: center;
      font-size: .95rem;
      color: #555;
      background: #f0f5ff;
      border-left: 5px solid var(--blue);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 14px;
      min-height: 44px;
      line-height: 1.6;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-family: 'Noto Serif JP', serif;
      margin-bottom: 10px;
      transition: transform .15s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .btn-go   { background: linear-gradient(135deg, #1d8a50, var(--green)); color: white; }
    .btn-stop { background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.75;} }
    .btn-gray { background: #f5f0e0; color: #666; border: 1px solid #ccc; font-size: .9rem; }
    .progress-bar {
      height: 10px;
      background: #c8dff0;
      border-radius: 5px;
      overflow: hidden;
      margin: 8px 0 4px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #5dade2);
      width: 0%;
      transition: width .3s;
    }
    .error-box {
      background: #fff3cd;
      border: 2px solid #ffc107;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
      font-size: .85rem;
      line-height: 1.8;
      color: #856404;
      display: none;
    }
    .error-box.show { display: block; }
    .rec-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e74c3c;
      border-radius: 50%;
      margin-right: 6px;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="pageTitle"></h1>
    <div class="sub">このタブで録音します。終わったら自動で元の画面に結果が送られます。</div>
    <div class="sub" style="margin-top:-8px;">‿ は単語がつながって聞こえる場所（リンキング）の目安です</div>

    <div id="textDisplay">テキストを読み込んでいます…</div>

    <div id="modelBox" style="display:none;">
      <div class="sub" style="margin-bottom:6px;" id="modelStatusText">AIモデルを準備中…（初回のみダウンロード）</div>
      <div class="progress-bar"><div class="progress-fill" id="modelProgressFill"></div></div>
    </div>

    <div id="status">準備中…</div>

    <div id="errorBox" class="error-box"></div>

    <button id="micBtn" class="btn btn-go" onclick="handleMic()" disabled>はっけよい！</button>
    <button class="btn btn-gray" onclick="window.close()">このタブを閉じる</button>
  </div>

  <script type="module">
    // 絵文字はコピペ・保存時に文字化けしやすいため、
    // 必ずUnicodeエスケープ(\u{...})で書く。
    const EMOJI_MIC   = '\u{1F3A4}'; // 🎤
    const EMOJI_STOP  = '\u{1F6D1}'; // 🛑

    document.getElementById('pageTitle').textContent = EMOJI_MIC + ' 音読大相撲 - マイク判定';
    document.getElementById('micBtn').textContent = EMOJI_MIC + ' はっけよい！';

    // ★ 変更: small(244M)を試したところ「マイク判定に反応していない」旨の
    //   エラーが発生したため、いったんbase(74M)に戻す。
    const MODEL_ID   = 'onnx-community/whisper-base.en';
    const MODEL_TASK = 'automatic-speech-recognition';

    /* ================================================================
       ★ 追加: 文字起こしをWeb Worker（別スレッド）で実行する
       ・これまではモデルの読み込み・文字起こしをメイン画面と同じ
         スレッドで直接行っていたため、処理が重いとブラウザに
         「ページが応答していません」と表示され、画面が固まって
         しまうことがあった（GitHub Pagesは特殊なHTTPヘッダーを
         設定できず、Whisperの計算をマルチスレッド化できないため、
         処理時間そのものは変わらない）。
       ・計算をWorker側に逃がすことで、計算時間は変わらなくても
         メイン画面の描画・操作はブロックされなくなり、「応答なし」
         警告が出なくなる。
       ・1ファイルで完結させるため、Workerのコードは文字列から
         Blob URLを作って読み込んでいる（別ファイルを用意する必要がない）。
    ================================================================ */
    const WORKER_SRC = [
      "import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/dist/transformers.min.js';",
      "env.useBrowserCache = true;",
      "env.allowLocalModels = false;",
      "let whisperPipeline = null;",
      "self.onmessage = async (e) => {",
      "  const { id, type } = e.data;",
      "  try {",
      "    if (type === 'load') {",
      "      const { modelId, task } = e.data;",
      "      whisperPipeline = await pipeline(task, modelId, {",
      "        progress_callback: (prog) => { self.postMessage({ id, type: 'progress', progress: prog }); }",
      "      });",
      "      self.postMessage({ id, type: 'done', result: true });",
      "    } else if (type === 'transcribe') {",
      "      const { audio, options } = e.data;",
      "      const result = await whisperPipeline(audio, options);",
      "      self.postMessage({ id, type: 'done', result: { text: result.text } });",
      "    }",
      "  } catch (err) {",
      "    self.postMessage({ id, type: 'error', message: (err && err.message) ? err.message : String(err) });",
      "  }",
      "};"
    ].join('\n');
    const micWorker = new Worker(
      URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })),
      { type: 'module' }
    );

    let reqCounter = 0;
    const pendingRequests = new Map(); // id -> { resolve, reject, onProgress }
    micWorker.onmessage = (e) => {
      const data = e.data || {};
      const req = pendingRequests.get(data.id);
      if (!req) return;
      if (data.type === 'progress') {
        if (req.onProgress) req.onProgress(data.progress);
      } else if (data.type === 'done') {
        pendingRequests.delete(data.id);
        req.resolve(data.result);
      } else if (data.type === 'error') {
        pendingRequests.delete(data.id);
        req.reject(new Error(data.message));
      }
    };
    micWorker.onerror = (e) => {
      console.error('[Worker] error:', e.message || e);
    };
    // Worker宛のリクエストをPromiseでラップするヘルパー。
    // audioがFloat32Arrayの場合はTransferable（ゼロコピー）で送る。
    function workerRequest(type, payload, onProgress) {
      return new Promise((resolve, reject) => {
        const id = ++reqCounter;
        pendingRequests.set(id, { resolve, reject, onProgress });
        const transfer = [];
        if (payload && payload.audio && payload.audio.buffer) transfer.push(payload.audio.buffer);
        micWorker.postMessage(Object.assign({ id, type }, payload), transfer);
      });
    }

    let modelReady       = false;
    let mediaStream      = null;
    let mediaRecorder    = null;
    let audioChunks      = [];
    let isRecording      = false;
    let recordingStart   = null;
    let recordingStopTime = null;

    // URLパラメータの取得
    function getParams() {
      const qs = new URLSearchParams(location.search);
      return {
        title: qs.get('title') || '',
        text:  qs.get('text')  || '',
        mode:  qs.get('mode')  || 'practice',
        meta:  qs.get('meta')  || ''
      };
    }
    const params = getParams();

    // ★ 追加: リンキング（単語同士の連結発音）の目安表示
    //   厳密な音声解析ではなく、スペル上の「子音で終わる単語＋母音で
    //   始まる単語」「同じ子音の連続」という学校英語の基本ルールに基づく
    //   簡易的な目安。採点には使わない（読む時の気づきを促す表示のみ）。
    function cleanWordForLink(s) {
      return String(s).toLowerCase().replace(/[^a-z0-9]/g, '');
    }
    const VOWEL_LETTERS = ['a','e','i','o','u'];
    function isVowelLetter(ch)     { return VOWEL_LETTERS.indexOf(ch) !== -1; }
    function isConsonantLetter(ch) { return /^[a-z]$/.test(ch) && !isVowelLetter(ch); }
    function computeLinking(tokens) {
      const linkAfter = new Array(tokens.length).fill(false);
      for (let i = 0; i < tokens.length - 1; i++) {
        const t = tokens[i], nt = tokens[i + 1];
        if (!t || !nt || t.isSkip || nt.isSkip) continue;
        if (/[.!?,;:]/.test(t.display)) continue; // 区切りの句読点の後はリンキングさせない
        const lastCh  = t.clean  ? t.clean[t.clean.length - 1]   : '';
        const firstCh = nt.clean ? nt.clean[0]                    : '';
        if (!lastCh || !firstCh) continue;
        if (isConsonantLetter(lastCh) && isVowelLetter(firstCh)) linkAfter[i] = true;
        else if (lastCh === firstCh && isConsonantLetter(lastCh)) linkAfter[i] = true;
      }
      return linkAfter;
    }

    // テキストの表示
    function renderTargetText(rawText) {
      const el = document.getElementById('textDisplay');
      el.innerHTML = '';
      const regex = /<([^>]+)>|(\S+)/g;
      let m;
      const tokens = [];
      while ((m = regex.exec(rawText)) !== null) {
        if (m[1]) {
          tokens.push({ display: m[1], isProper: true, isSkip: false, clean: cleanWordForLink(m[1]) });
        } else {
          const clean = cleanWordForLink(m[2]);
          tokens.push({ display: m[2], isProper: false, isSkip: (clean.length === 0), clean: clean });
        }
      }
      const linkAfter = computeLinking(tokens);
      const frag = document.createDocumentFragment();
      tokens.forEach(function(t, i) {
        const span = document.createElement('span');
        span.textContent = t.display + ' ';
        if (t.isProper) {
          span.style.color = '#1a5276';
          span.style.fontStyle = 'italic';
        }
        frag.appendChild(span);
        if (linkAfter[i]) {
          const mark = document.createElement('span');
          mark.textContent = '\u203F';
          mark.style.color = '#c9a227';
          mark.style.fontWeight = '700';
          frag.appendChild(mark);
        }
      });
      el.appendChild(frag);
    }

    if (params.text) {
      renderTargetText(decodeURIComponent(params.text));
    } else {
      document.getElementById('textDisplay').textContent = '（テキストが渡されていません）';
    }

    // 同一の単語や短いフレーズ(1〜4語)が3回以上連続している場合、
    // Whisperの繰り返しハルシネーションとみなして1回分に圧縮する。
    function collapseRepeatedPhrases(text) {
      if (!text) return text;
      const words = text.split(/\s+/);
      for (let phraseLen = 1; phraseLen <= 4; phraseLen++) {
        const result = [];
        let i = 0;
        while (i < words.length) {
          const phrase = words.slice(i, i + phraseLen).join(' ').toLowerCase();
          let repeatCount = 1;
          let j = i + phraseLen;
          while (
            j + phraseLen <= words.length &&
            words.slice(j, j + phraseLen).join(' ').toLowerCase() === phrase &&
            phrase.length > 0
          ) {
            repeatCount++;
            j += phraseLen;
          }
          if (repeatCount >= 3) {
            result.push(...words.slice(i, i + phraseLen));
            i = j;
          } else {
            result.push(words[i]);
            i++;
          }
        }
        words.length = 0;
        words.push(...result);
      }
      return words.join(' ');
    }

    function setStatus(msg) {
      document.getElementById('status').innerHTML = msg;
    }
    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.innerHTML = msg;
      box.classList.add('show');
    }
    function hideError() {
      document.getElementById('errorBox').classList.remove('show');
    }
    function resetMicButton() {
      const btn = document.getElementById('micBtn');
      btn.textContent = EMOJI_MIC + ' もう一度読む';
      btn.className = 'btn btn-go';
      btn.disabled = false;
    }

    // Whisperモデルの読み込み（実体はWorker側で行う）
    async function preloadWhisper() {
      document.getElementById('modelBox').style.display = 'block';
      setStatus('AIモデルを読み込んでいます…（初回は数十MB程度のダウンロードが発生します）');
      try {
        await workerRequest('load', { modelId: MODEL_ID, task: MODEL_TASK }, (prog) => {
          if (prog.status === 'downloading' || prog.status === 'loading') {
            const pct = prog.total > 0 ? Math.round((prog.loaded / prog.total) * 100) : 0;
            document.getElementById('modelProgressFill').style.width = pct + '%';
            document.getElementById('modelStatusText').innerText = 'ダウンロード中… ' + pct + '%';
          } else if (prog.status === 'ready') {
            document.getElementById('modelProgressFill').style.width = '100%';
            document.getElementById('modelStatusText').innerText = '準備完了';
          }
        });
        modelReady = true;
        document.getElementById('modelBox').style.display = 'none';
        document.getElementById('micBtn').disabled = false;
        setStatus('準備完了！「はっけよい」を押して読んでください。');
      } catch (err) {
        console.error(err);
        setStatus('モデル読み込みに失敗しました。ページをリロードしてください。エラー: ' + err.message);
      }
    }
    preloadWhisper();

    // マイクボタンの処理
    window.handleMic = async function() {
      if (isRecording) {
        stopCapture();
        return;
      }
      if (!modelReady) {
        alert('AIモデルをまだ準備中です。');
        return;
      }
      await startCapture();
    };

    async function startCapture() {
      hideError();
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        console.error('[Mic] getUserMedia error:', err.name, err.message);
        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
          showError('マイクの許可が必要です。ブラウザのアドレスバー付近でマイクを許可してください。');
        } else if (err.name === 'NotFoundError') {
          showError('マイクが見つかりません。マイクが接続されているか確認してください。');
        } else {
          showError('マイクエラー: ' + err.name + ' ' + err.message);
        }
        return;
      }

      audioChunks = [];
      const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
        ? 'audio/webm;codecs=opus'
        : 'audio/webm';
      mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      mediaRecorder.onstop = () => processAudio();
      mediaRecorder.start(100);

      isRecording    = true;
      recordingStart = new Date();

      const btn = document.getElementById('micBtn');
      btn.innerHTML = '<span class="rec-dot"></span>' + EMOJI_STOP + ' 止めて判定';
      btn.className = 'btn btn-stop';
      setStatus('録音中… 読み終わったら「止めて判定」を押してください');
    }

    function stopCapture() {
      isRecording       = false;
      recordingStopTime = new Date();
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        try { mediaRecorder.requestData(); } catch (e) { /* 一部ブラウザ非対応のため無視 */ }
        mediaRecorder.stop();
      }
      if (mediaStream) {
        mediaStream.getTracks().forEach((t) => t.stop());
        mediaStream = null;
      }
      const btn = document.getElementById('micBtn');
      btn.textContent = '解析中…';
      btn.className  = 'btn btn-gray';
      btn.disabled   = true;
      setStatus('AIが音声を解析中です…');
    }

    async function processAudio() {
      try {
        // 録音時間・データが短すぎる場合は弾く
        const recordedMs = (recordingStopTime && recordingStart)
          ? (recordingStopTime - recordingStart)
          : 0;
        if (audioChunks.length === 0 || recordedMs < 400) {
          showError('録音時間が短すぎました。「はっけよい！」を押してから1秒以上読んでください。');
          setStatus('録音をやり直してください。');
          resetMicButton();
          return;
        }

        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        if (blob.size === 0) {
          showError('音声データを取得できませんでした。マイクの接続を確認し、もう一度お試しください。');
          setStatus('録音をやり直してください。');
          resetMicButton();
          return;
        }

        const arrayBuffer = await blob.arrayBuffer();
        const ctx = new AudioContext({ sampleRate: 16000 });
        let decoded;
        try {
          decoded = await ctx.decodeAudioData(arrayBuffer);
        } catch (decodeErr) {
          await ctx.close();
          console.error('[Whisper] decode error:', decodeErr);
          showError('録音した音声をうまく読み取れませんでした。もう一度「はっけよい！」から録音し直してください。');
          setStatus('録音をやり直してください。');
          resetMicButton();
          return;
        }
        await ctx.close();

        let float32;
        if (decoded.numberOfChannels >= 2) {
          const ch0 = decoded.getChannelData(0);
          const ch1 = decoded.getChannelData(1);
          float32 = new Float32Array(ch0.length);
          for (let i = 0; i < ch0.length; i++) float32[i] = (ch0[i] + ch1[i]) / 2;
        } else {
          float32 = decoded.getChannelData(0);
        }

        // WPMの異常値対策: 処理待ち時間を含む壁時計時間ではなく、
        // 実際に録音された音声データそのものの長さ(秒)を使う。
        // PCの処理速度差の影響を受けず安定する。
        const duration = decoded.duration || ((recordingStopTime && recordingStart)
          ? (recordingStopTime - recordingStart) / 1000
          : 1) || 1;
        setStatus('文字起こし中…');

        const result = await workerRequest('transcribe', {
          audio: float32,
          options: {
            chunk_length_s: 30,
            stride_length_s: 5,
            // 同じ語句を繰り返し書き起こしてしまうWhisperの幻覚(ハルシネーション)対策。
            // 無音・雑音区間で同一フレーズをループ生成するのを抑える。
            no_repeat_ngram_size: 3,
            repetition_penalty: 1.3,
            condition_on_previous_text: false
          }
        });

        let transcript = (result.text || '').trim();

        // 上記の対策をすり抜けた場合の保険として、
        // 同じ単語(列)が3回以上連続する場合は1回にまとめる。
        transcript = collapseRepeatedPhrases(transcript);

        setStatus(transcript ? ('認識結果: ' + transcript) : '（音声を認識できませんでした）');

        // 結果を親ウィンドウに送信
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({
            type:       'ondoSumoMicResult',
            transcript: transcript,
            duration:   duration,
            meta:       params.meta
          }, '*');
          setStatus('結果を送信しました。元のタブに戻って結果を確認してください。');
        } else {
          showError('元のタブが見つかりません。元のタブを閉じずに開いたままにしてください。');
        }
      } catch (err) {
        console.error('[Whisper] error:', err);
        showError('解析中にエラーが発生しました: ' + err.message + ' もう一度お試しください。');
        setStatus('録音をやり直してください。');
      } finally {
        resetMicButton();
      }
    }
  </script>
</body>
</html>
